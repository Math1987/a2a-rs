name: CLI Plugin Interop

on:
  pull_request:
    paths:
      - 'a2acli-transport-slimrpc/**'
      - '.github/workflows/cli-plugin-interop.yml'
  push:
    branches:
      - main
    paths:
      - 'a2acli-transport-slimrpc/**'
      - '.github/workflows/cli-plugin-interop.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; nothing is published from this job.
permissions:
  contents: read

jobs:
  cli-plugin-interop:
    name: a2a-cli plugin discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: false

      - name: Build the slimrpc transport plugin and echo agent
        run: cargo build -p a2acli-transport-slimrpc --bins --examples --locked

      - name: Download the a2a-cli release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/a2a-cli"
          gh release download --repo a2aproject/a2a-cli \
            --pattern '*_linux_amd64.tar.gz' \
            --dir "$RUNNER_TEMP/a2a-cli" \
            --clobber
          tar -xzf "$RUNNER_TEMP"/a2a-cli/*_linux_amd64.tar.gz -C "$RUNNER_TEMP/a2a-cli"

      - name: Put a2a and the plugin on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 target/debug/a2a-transport-slimrpc "$RUNNER_TEMP/bin/"
          install -m 0755 "$RUNNER_TEMP/a2a-cli/a2a" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: a2a-cli discovers the slimrpc plugin
        # `a2a transport list` launches every plugin's `info` subcommand and
        # renders its metadata as a table; the plugin never needs a SLIM
        # gateway for this. Real slimrpc/1.0.0 metadata surfacing through the
        # real a2a-cli binary verifies discovery before the live gateway check.
        run: |
          a2a transport list | tee transport-list.txt
          grep -qE '^slimrpc\s' transport-list.txt

      - name: a2a-cli surfaces the plugin's real startup error
        # Without $A2A_SLIMRPC_PLUGIN_CONFIG, `serve` fails immediately.
        # a2a-cli reads a single JSON handshake line from the plugin's
        # stdout to learn this; without one, it reports a bare "reading
        # handshake: EOF" instead of the plugin's actual error. Asserting on
        # our specific message (not just a nonzero exit) is what would catch
        # a regression back to that generic failure.
        #
        # This step intentionally runs a command expected to fail, and
        # PASSES when it fails with the right message -- the "Error: ..."
        # line below is the expected assertion target, not a build failure.
        run: |
          echo "::notice::The following 'a2a send' failure is expected -- the plugin configuration is intentionally unset in this step. This step passes if the error names A2A_SLIMRPC_PLUGIN_CONFIG (our real cause), and fails if it doesn't (e.g. a regression to a generic EOF)."
          set +e
          output=$(a2a send --transport slimrpc --endpoint org/namespace/agent "hello" 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          [ "$exit_code" -ne 0 ]
          echo "$output" | grep -q 'A2A_SLIMRPC_PLUGIN_CONFIG'

      - name: Send unary and streaming messages through a real SLIM gateway
        timeout-minutes: 5
        run: |
          set -euo pipefail
          gateway_id=""
          echo_pid=""
          echo_log="$RUNNER_TEMP/slimrpc-echo.log"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              [ -z "$gateway_id" ] || docker logs "$gateway_id" || true
              [ ! -f "$echo_log" ] || cat "$echo_log"
            fi
            if [ -n "$echo_pid" ]; then
              kill "$echo_pid" 2>/dev/null || true
              wait "$echo_pid" 2>/dev/null || true
            fi
            [ -z "$gateway_id" ] || docker rm -f "$gateway_id" >/dev/null || true
          }
          trap cleanup EXIT

          gateway_id=$(docker run -d --rm \
            -p 127.0.0.1:46357:46357 \
            -v "$PWD/a2acli-transport-slimrpc/examples/slim-gateway.yaml:/config.yaml:ro" \
            ghcr.io/agntcy/slim:2.3.0 /slim --config /config.yaml)
          timeout 30s bash -c 'until echo >/dev/tcp/127.0.0.1/46357; do sleep 1; done' 2>/dev/null

          target/debug/examples/echo-server >"$echo_log" 2>&1 &
          echo_pid=$!
          for attempt in {1..30}; do
            kill -0 "$echo_pid"
            if grep -q 'Echo agent ready at org/demo/echo' "$echo_log"; then
              break
            fi
            sleep 1
          done
          grep -q 'Echo agent ready at org/demo/echo' "$echo_log"

          export A2A_SLIMRPC_PLUGIN_CONFIG="$PWD/a2acli-transport-slimrpc/examples/plugin.yaml"
          timeout 30s a2a send --transport slimrpc --endpoint slim://org/demo/echo \
            "hello over SLIMRPC" | tee "$RUNNER_TEMP/slimrpc-unary.txt"
          grep -Fq 'Echo: hello over SLIMRPC' "$RUNNER_TEMP/slimrpc-unary.txt"
          timeout 30s a2a send --stream --transport slimrpc --endpoint slim://org/demo/echo \
            "hello stream" | tee "$RUNNER_TEMP/slimrpc-stream.txt"
          grep -Fq 'Echo: hello stream' "$RUNNER_TEMP/slimrpc-stream.txt"
